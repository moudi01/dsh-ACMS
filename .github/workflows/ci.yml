name: ACMS validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:docs
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:usability
      - run: npm run test:structure
      - run: npm run test:graph-ui
      - run: npm run test:display
      - run: npm run test:activity
      - run: npm run test:capacity
      - run: npm run test:goal-priority
      - run: npm run test:artifact-download
      - run: npm run test:review-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acms-ui-evidence
          path: test-results/ui
